# robot_localization EKF (Phase 4): odom -> base_link in the wall plane from wheel odometry
# (prototype, wcr_proto2 proto_driver /odom: vx from the N20 encoders, vy = 0 of the skid steer) and the
# IMU yaw rate (gyro z = wall normal); the skid-steer wheel yaw estimate is not fused (it slips).
ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    odom0: /odom
    #              x      y      z      roll   pitch  yaw    vx     vy     vz     vroll  vpitch vyaw   ax     ay     az
    odom0_config: [false, false, false, false, false, false, true,  true,  false, false, false, false, false, false, false]
    odom0_differential: false

    imu0: /imu
    imu0_config:  [false, false, false, false, false, false, false, false, false, false, false, true,  false, false, false]
    imu0_differential: false
    imu0_remove_gravitational_acceleration: false
